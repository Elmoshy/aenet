name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ github.ref_name }}
      require_signing: true
    secrets: inherit
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir out
          cp "$(find artifacts/AENET-android -name '*.apk' | head -n 1)" "out/AENET-${V}-android-arm64.apk"
          cp "$(find artifacts/AENET-windows-setup -name '*.exe' | head -n 1)" "out/AENET-${V}-windows-setup.exe"
          (cd artifacts/AENET-windows-portable && zip -qr "../../out/AENET-${V}-windows-portable.zip" .)
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "ÆNET $GITHUB_REF_NAME" --generate-notes --verify-tag $FLAGS
